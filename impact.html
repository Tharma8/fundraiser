<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Impact Nexus | Northern Hope</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background: #020617; color: #f8fafc; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        
        .impact-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
            position: fixed; width: 100vw; height: 100vh; pointer-events: none; z-index: -1;
        }

        .nexus-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(249, 115, 22, 0.2);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .nexus-card:hover {
            transform: translateY(-5px);
            border-top: 1px solid #f97316;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .btn-scan {
            position: relative;
            overflow: hidden;
        }
        .btn-scan::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent, rgba(249, 115, 22, 0.4), transparent);
            animation: scan 3s infinite linear;
        }
        @keyframes scan {
            0% { top: -100%; }
            100% { top: 100%; }
        }

        .stream-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #f97316, transparent);
            position: relative; overflow: hidden;
        }
        .stream-line::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: flow 2s infinite linear;
        }
        @keyframes flow { 100% { left: 100%; } }

        /* Advanced Floating Animation for CTA */
        .float-btn {
            animation: hoverFloat 4s ease-in-out infinite;
        }
        @keyframes hoverFloat {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-10px) translateX(5px); }
        }
    </style>
</head>
<body x-data="impactNexus()" x-init="initMissionTimer()">

    <div class="impact-gradient"></div>

    <nav class="p-8 flex justify-between items-center relative z-50">
        <a href="index.html" class="group flex items-center gap-3">
            <div class="w-10 h-10 rounded-full border border-orange-500/30 flex items-center justify-center group-hover:bg-orange-500 transition-all">
                <span class="text-orange-500 group-hover:text-white">←</span>
            </div>
            <span class="text-xs font-bold uppercase tracking-widest text-slate-400 group-hover:text-white">Back to Command</span>
        </a>

        <div class="flex items-center gap-6">
            <div class="hidden md:flex items-center gap-4 border-r border-white/10 pr-6">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                </span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">System Online: Feb 2026</span>
            </div>
            <a href="donate.html" class="btn-scan group px-6 py-2 bg-orange-500 text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-orange-400 transition-all flex items-center gap-2">
                Initiate Contribution
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-8 py-12">
        <section class="mb-32 relative min-h-[250px] md:min-h-[300px] flex items-center justify-center">
            <template x-for="(story, index) in testimonials" :key="index">
                <div x-show="activeStory === index" 
                     x-transition:enter="transition ease-out duration-1000"
                     x-transition:enter-start="opacity-0 translate-y-10"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-500"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95"
                     class="absolute w-full flex flex-col md:flex-row items-center gap-12 text-center md:text-left">
                    
                    <div class="flex-1">
                        <div class="inline-block px-3 py-1 rounded-full border border-orange-500/30 text-[9px] font-black text-orange-500 uppercase tracking-[0.3em] mb-6">
                            Verified Impact Story // <span x-text="story.id"></span>
                        </div>
                        <h2 class="text-3xl md:text-5xl font-black italic tracking-tighter mb-4 leading-none" x-text="'&quot;' + story.text + '&quot;'"></h2>
                        <p class="text-slate-500 font-bold uppercase text-xs tracking-widest">— <span x-text="story.author"></span>, <span class="text-orange-500" x-text="story.region"></span></p>
                    </div>

                    <div class="float-btn">
                        <a href="donate.html" class="nexus-card block p-8 rounded-[2rem] hover:border-orange-500 transition-all">
                            <p class="text-[10px] font-bold text-slate-500 uppercase mb-4">Support This Mission</p>
                            <div class="flex items-center gap-4">
                                <span class="text-2xl font-black text-white">$25.00</span>
                                <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.4)]">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </template>
        </section>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <template x-for="metric in metrics">
                <div class="nexus-card p-8 rounded-3xl overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-8">
                            <div class="bg-orange-500/10 p-3 rounded-xl border border-orange-500/20">
                                <svg class="w-6 h-6 text-orange-500" fill="currentColor" viewBox="0 0 24 24" x-html="metric.icon"></svg>
                            </div>
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest" x-text="metric.category"></span>
                        </div>
                        <h3 class="text-6xl font-black mb-1 tracking-tighter" x-text="metric.value"></h3>
                        <p class="text-orange-500 font-bold text-xs uppercase tracking-widest mb-6" x-text="metric.label"></p>
                        <p class="text-slate-400 text-sm leading-relaxed mb-8" x-text="metric.description"></p>
                    </div>
                    <div class="space-y-4">
                        <div class="p-4 rounded-2xl bg-white/5 border border-white/5 italic text-xs text-slate-300">
                            "<span x-text="metric.quote"></span>"
                        </div>
                        <div class="stream-line"></div>
                    </div>
                </div>
            </template>
        </div>

        <div class="mt-32">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                <div class="max-w-xl">
                    <h3 class="text-4xl font-black mb-4 uppercase italic tracking-tighter text-orange-500">Live Mission Feed</h3>
                    <p class="text-slate-400">Capturing the exact moment of transition from digital hope to physical reality.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <template x-for="(img, index) in gallery">
                    <div class="group relative h-[450px] rounded-3xl overflow-hidden bg-slate-900 border border-white/10">
                        <img :src="img.url" class="absolute inset-0 w-full h-full object-cover opacity-50 group-hover:opacity-80 transition-all duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-transparent"></div>
                        
                        <a href="donate.html" class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-all duration-500 translate-y-[-10px] group-hover:translate-y-0 bg-orange-500 p-3 rounded-xl shadow-2xl">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                            </svg>
                        </a>

                        <div class="absolute bottom-0 p-8">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>
                                <span class="text-[10px] font-bold text-orange-500 uppercase tracking-[0.2em]" x-text="img.location"></span>
                            </div>
                            <h4 class="text-xl font-bold text-white mb-2 leading-tight" x-text="img.caption"></h4>
                            <p class="text-xs text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity" x-text="img.details"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mt-20">
        <p class="text-[10px] font-bold text-slate-600 uppercase tracking-[0.5em]">Northern Hope Foundation &copy; 2026</p>
    </footer>

    <script>
        function impactNexus() {
            return {
                activeStory: 0,
                testimonials: [
                    { id: 'MIS-001', author: 'Amara', region: 'Sector Delta', text: 'My children no longer go to bed hungry. The Nexus changed our reality.' },
                    { id: 'MIS-002', author: 'Kael', region: 'Northern Ridge', text: 'Clean water is no longer a luxury, but a right we finally enjoy.' },
                    { id: 'MIS-003', author: 'Elena', region: 'Sector 07', text: 'The solar kits allowed my daughter to study for her exams after sunset.' }
                ],
                initMissionTimer() {
                    setInterval(() => {
                        this.activeStory = (this.activeStory + 1) % this.testimonials.length;
                    }, 8000);
                },
                metrics: [
                    { 
                        category: 'Nutrition', 
                        value: '892,400', 
                        label: 'Meals Deployed', 
                        description: 'Logistics chain active. 12,000 children provided with vitamin-fortified sustenance this month.',
                        quote: 'The nutrition kits saved my daughter when the harvest failed.',
                        icon: '<path d="M11 9H9V2H7V9H5V2H3V9C3 11.12 4.66 12.84 6.75 12.97V22H9.25V12.97C11.34 12.84 13 11.12 13 9V2H11V9ZM16 6V14H18.5V22H21V2C18.24 2 16 4.24 16 6Z"/>' 
                    },
                    { 
                        category: 'Hydration', 
                        value: '1.24M', 
                        label: 'Purified Liters', 
                        description: 'Deploying smart-well technology to sectors previously relying on contaminated sources.',
                        quote: 'The water gives them life.',
                        icon: '<path d="M12 2C12 2 6 8 6 12C6 15.31 8.69 18 12 18C15.31 18 18 15.31 18 12C18 8 12 2 12 2Z"/>' 
                    },
                    { 
                        category: 'Education', 
                        value: '45,000', 
                        label: 'Digital Toolkits', 
                        description: 'Bridging the digital divide with solar tablets and localized AI tutors.',
                        quote: 'I am learning to code for a world I haven\'t seen yet.',
                        icon: '<path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>' 
                    }
                ],
                gallery: [
                    { url: 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?q=80&w=800', location: 'Northern Sector A', caption: 'The First Drop.', details: 'New purification unit serving 500 families.' },
                    { url: 'https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=800', location: 'Field School 04', caption: 'Digital Pioneers.', details: 'Tablets delivered to the 2026 cohort.' },
                    { url: 'https://images.unsplash.com/photo-1489440543286-a69330151c0b?q=80&w=800', location: 'Distribution Hub', caption: 'Sustainance Log.', details: 'Food kits ready for high-altitude transport.' },
                    { url: 'https://images.unsplash.com/photo-1542810634-71277d95dcbb?q=80&w=800', location: 'Central Hub', caption: 'The Human Result.', details: 'Community health index up by 22%.' }
                ]
            }
        }
    </script>
</body>
</html>
